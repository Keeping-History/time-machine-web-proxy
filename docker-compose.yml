services:
  timemachine:
    build: .
    develop:
      watch:
        - path: ./
          action: rebuild       # Trigger a full image rebuild
    env_file:
      - .env
    ports:
      - "${TIMEMACHINE_PORT:-8765}:${TIMEMACHINE_PORT:-8765}"
    volumes:
      - ${HOST_CACHE_DIR:-timemachine-cache}:${CACHE_DIR:-/app/cache}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bullboard:
    image: venatum/bull-board:latest
    ports:
      - "3008:3000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BULL_VERSION=BULLMQ
      # Must match BULLMQ_PREFIX in the timemachine service (default "tm").
      # Default is "bull" — without this override no queues appear.
      - BULL_PREFIX=tm
    depends_on:
      - redis

volumes:
  timemachine-cache:
