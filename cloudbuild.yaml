# Cloud Build — build and deploy Time Machine Web Proxy to Cloud Run
#
# Cloud Run terminates TLS and WSS at the edge. Traffic arrives at the
# container as plain HTTP, so the app needs no TLS configuration.
#
# Deploy via: ./deploy.sh [prod]
# Or directly: gcloud builds submit --config cloudbuild.yaml . \
#   --project=PROJECT_ID \
#   --substitutions=_CACHE_BUCKET=BUCKET,COMMIT_SHA=$(git rev-parse --short HEAD)
#
# Substitutions (override via --substitutions or Cloud Build trigger):
#   _REGION             GCP region to deploy to          (default: us-central1)
#   _AR_HOSTNAME        Artifact Registry hostname        (default: us-docker.pkg.dev)
#   _AR_REPOSITORY      Artifact Registry repository name (default: cloud-run-source-deploy)
#   _SERVICE_NAME       Cloud Run service name            (default: time-machine-proxy)
#   _CACHE_BUCKET       GCS bucket name for shared cache  (default: tm-cache-723408812472)
#   _DOCKERHUB_USERNAME Docker Hub username               (default: robbiebyrd)
#   _VPC_CONNECTOR      Serverless VPC Access connector   (operator must set;
#                                                          required to reach
#                                                          Memorystore)

steps:
  # Build the container image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA
      - -t
      - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest
      - .

  # Authenticate Docker to Artifact Registry
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: [auth, configure-docker, $_AR_HOSTNAME, --quiet]

  # Push to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME

  # Login to Docker Hub using token from Secret Manager
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - echo "$$DOCKERHUB_TOKEN" | docker login --username $_DOCKERHUB_USERNAME --password-stdin
    secretEnv: [DOCKERHUB_TOKEN]

  # Tag for Docker Hub
  - name: gcr.io/cloud-builders/docker
    args:
      - tag
      - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA
      - $_DOCKERHUB_USERNAME/$_SERVICE_NAME:$COMMIT_SHA
  - name: gcr.io/cloud-builders/docker
    args:
      - tag
      - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest
      - $_DOCKERHUB_USERNAME/$_SERVICE_NAME:latest

  # Push to Docker Hub
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_DOCKERHUB_USERNAME/$_SERVICE_NAME

  # Convert .env.prod (shell KEY=value format) to YAML (KEY: value) for
  # --env-vars-file, which expects a YAML map. The shell format must be
  # preserved so that deploy.sh can still `source` it locally.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - -c
      - |
        grep -v '^\s*#' .env.prod | grep -v '^\s*$' |
        awk -F'=' '{v=$2; for(i=3;i<=NF;i++) v=v"="$i; printf "%s: \"%s\"\n", $1, v}' |
        sed 's/^LISTENER: .*/LISTENER: "0.0.0.0"/' > env.yaml

  # Deploy to Cloud Run (gen2)
  #
  # --execution-environment=gen2 is required for GCS volume mounts.
  #
  # --add-volume / --add-volume-mount mounts the GCS bucket at /app/cache via
  #   GCS FUSE. All instances share the same bucket. The v2 cache layout is
  #   filesystem-tree (cacheDir/v2/<time>/<host>/<path>); two instances racing
  #   on the same path write identical content from the downloader.
  #
  # --env-vars-file loads env.yaml (converted from .env.prod with LISTENER
  #   overridden to 0.0.0.0, since .env.prod binds to 127.0.0.1 which Cloud
  #   Run cannot reach).
  #
  # --session-affinity keeps WebSocket connections on the same instance for
  #   their full lifetime.
  #
  # --timeout 3600 allows long-lived WebSocket connections (max Cloud Run
  #   supports). HTTP requests still honour normal timeouts.
  #
  # --vpc-connector is required to reach Memorystore (private IP). Replace
  #   $_VPC_CONNECTOR with the name of an existing Serverless VPC Access
  #   connector in the same region. See docs/deployment.md.
  #
  # --vpc-egress=private-ranges-only sends only RFC1918 traffic through the
  #   connector; public traffic (Wayback, outbound proxy) still uses the
  #   default egress path.
  #
  # --set-secrets injects the full REDIS_URL (including AUTH) and the
  #   outbound-proxy password from Secret Manager. The app reads REDIS_URL
  #   verbatim — there is no in-process expansion of REDIS_PASSWORD.
  #   infra-setup.sh writes the AUTH-only redis-password secret; for Cloud
  #   Run we use the full URL in the redis-url secret instead. Create with:
  #     printf '%s' "redis://default:<auth>@<host>:6379" \
  #       | gcloud secrets create redis-url --replication-policy=automatic --data-file=-
  #     gcloud secrets add-iam-policy-binding redis-url \
  #       --member="serviceAccount:<PROJECT_NUMBER>-compute@developer.gserviceaccount.com" \
  #       --role="roles/secretmanager.secretAccessor"
  #   (and likewise for outbound-proxy-password).
  #
  # --min-instances=1 and --no-cpu-throttling keep the in-process BullMQ
  #   worker scheduled when no request is active. Without these, the worker
  #   stalls between requests. Cost: ~$10-15/mo per always-on instance.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --execution-environment=gen2
      - --allow-unauthenticated
      - --env-vars-file=env.yaml
      - --port=8765
      - --session-affinity
      - --timeout=3600
      - --cpu=1
      - --memory=512Mi
      - --min-instances=1
      - --max-instances=10
      - --no-cpu-throttling
      - --vpc-connector=$_VPC_CONNECTOR
      - --vpc-egress=private-ranges-only
      - --set-secrets=REDIS_URL=redis-url:latest,OUTBOUND_PROXY_PASSWORD=outbound-proxy-password:latest
      - --add-volume=name=cache,type=cloud-storage,bucket=$_CACHE_BUCKET
      - --add-volume-mount=volume=cache,mount-path=/app/cache

images:
  - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$COMMIT_SHA
  - $_AR_HOSTNAME/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/dockerhub-token/versions/latest
      env: DOCKERHUB_TOKEN

substitutions:
  _SERVICE_NAME: time-machine-proxy
  _REGION: us-central1
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _AR_REPOSITORY: cloud-run-source-deploy
  _CACHE_BUCKET: tm-cache-723408812472
  _DOCKERHUB_USERNAME: robbiebyrd
  # Serverless VPC Access connector name. The connector must exist in the
  # same region as the service. See docs/deployment.md for the gcloud command
  # to create one.
  _VPC_CONNECTOR: tm-connector

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE
